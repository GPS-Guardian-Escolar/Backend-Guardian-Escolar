server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: gps-guardian-escolar-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gps_guardian_escolar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

guardian:
  api:
    public-base-url: ${API_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    require-https: ${REQUIRE_HTTPS:false}
    jwt:
      secret: ${JWT_SECRET:replace-me-in-local-env}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,http://localhost:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:smtp}
    from: ${APP_MAIL_FROM:no-reply@guardianescolar.local}
    from-name: ${APP_MAIL_FROM_NAME:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8081}
    brevo:
      api-key: ${BREVO_API_KEY:}
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  osrm:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  gps:
    route-deviation-threshold-meters: ${GPS_ROUTE_DEVIATION_THRESHOLD_METERS:150}
  push:
    expo:
      enabled: ${EXPO_PUSH_ENABLED:false}
      url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:GENERIC}
    provider-url: ${SMS_PROVIDER_URL:}
    api-key: ${SMS_API_KEY:}
    from: ${SMS_FROM:GuardianEscolar}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: ${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com/maps/api}
    routes-base-url: ${GOOGLE_MAPS_ROUTES_BASE_URL:https://routes.googleapis.com}
    connect-timeout-millis: ${GOOGLE_MAPS_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${GOOGLE_MAPS_READ_TIMEOUT_MILLIS:5000}
    cache:
      geocoding-ttl: ${GOOGLE_MAPS_GEOCODING_CACHE_TTL:48h}
      directions-ttl: ${GOOGLE_MAPS_DIRECTIONS_CACHE_TTL:10m}
      maximum-size: ${GOOGLE_MAPS_CACHE_MAXIMUM_SIZE:10000}
    resilience:
      retry-attempts: ${GOOGLE_MAPS_RETRY_ATTEMPTS:3}
      retry-wait: ${GOOGLE_MAPS_RETRY_WAIT:500ms}
      circuit-breaker-failure-rate-threshold: ${GOOGLE_MAPS_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
      circuit-breaker-sliding-window-size: ${GOOGLE_MAPS_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:20}
    rate-limit:
      permits-per-minute: ${GOOGLE_MAPS_RATE_LIMIT_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
