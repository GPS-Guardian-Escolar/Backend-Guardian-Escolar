spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: true
    path: /api/openapi.json
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

guardian:
  security:
    require-https: ${REQUIRE_HTTPS:true}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
  push:
    expo:
      enabled: ${EXPO_PUSH_ENABLED:true}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
