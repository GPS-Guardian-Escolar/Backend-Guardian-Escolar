name: Backend quality

on:
  pull_request:
  push:
    branches: [dev, qa, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gps_guardian_escolar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gps_guardian_escolar"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      JWT_SECRET: ci-only-secret-with-at-least-32-random-bytes
      DB_URL: jdbc:postgresql://localhost:5432/gps_guardian_escolar
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw --batch-mode clean verify
